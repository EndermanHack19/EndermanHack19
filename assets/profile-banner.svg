<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EndermanHack19 — Discord-разработка</title>
  <desc id="desc">Тёмный неоновый баннер с именем EndermanHack19 и темами Discord, автоматизации и AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.56" stop-color="#11162b" />
      <stop offset="1" stop-color="#17112d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.52" stop-color="#a855f7" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.98" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a5b4fc" stroke-opacity="0.065" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <ellipse cx="1040" cy="180" rx="250" ry="220" fill="url(#purpleGlow)" />
  <circle cx="1030" cy="175" r="90" fill="#8b5cf6" opacity="0.12" filter="url(#softGlow)" />
  <g fill="#c4b5fd" opacity="0.7">
    <circle cx="760" cy="65" r="2" />
    <circle cx="810" cy="285" r="2" />
    <circle cx="1110" cy="72" r="2" />
    <circle cx="1150" cy="260" r="2" />
    <rect x="723" y="134" width="5" height="5" rx="1" opacity="0.7" />
    <rect x="1130" y="118" width="6" height="6" rx="1" opacity="0.6" />
  </g>
  <rect x="66" y="55" width="383" height="34" rx="17" fill="#ffffff" fill-opacity="0.055" stroke="#c4b5fd" stroke-opacity="0.18" />
  <circle cx="85" cy="72" r="4" fill="#34d399" />
  <text x="101" y="77" fill="#d6d9ec" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DISCORD РАЗРАБОТКА · ANILAND COMPANY</text>
  <text x="65" y="166" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">EndermanHack19</text>
  <text x="69" y="211" fill="#c2c9dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Боты, автоматизация и полезные инструменты</text>
  <rect x="69" y="249" width="120" height="4" rx="2" fill="url(#accent)" />
  <text x="69" y="283" fill="#a8b1ca" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PYTHON  ·  DISCORD  ·  API</text>
  <!-- Neon portal frame -->
  <g transform="rotate(7 984 181)">
    <rect x="855" y="54" width="258" height="258" rx="38" fill="#17162f" fill-opacity="0.86" stroke="#a78bfa" stroke-opacity="0.48" stroke-width="1.5" />
    <rect x="874" y="73" width="220" height="220" rx="29" fill="none" stroke="url(#accent)" stroke-opacity="0.56" stroke-width="2" />
    <path d="M 898 244 L 898 168 C 898 120 933 91 984 91 C 1035 91 1070 120 1070 168 L 1070 244" fill="none" stroke="url(#portal)" stroke-width="9" stroke-linecap="round" opacity="0.8" />
    <path d="M 920 241 L 920 169 C 920 134 943 114 984 114 C 1025 114 1048 134 1048 169 L 1048 241" fill="#0d1224" stroke="#c4b5fd" stroke-opacity="0.36" stroke-width="1.5" />
    <!-- Pixel-inspired face -->
    <rect x="946" y="160" width="26" height="17" rx="4" fill="#c084fc" />
    <rect x="996" y="160" width="26" height="17" rx="4" fill="#c084fc" />
    <rect x="951" y="165" width="15" height="5" rx="2.5" fill="#f0abfc" opacity="0.9" />
    <rect x="1001" y="165" width="15" height="5" rx="2.5" fill="#f0abfc" opacity="0.9" />
    <rect x="972" y="193" width="24" height="7" rx="3.5" fill="#7278a0" opacity="0.75" />
    <rect x="961" y="220" width="46" height="3" rx="1.5" fill="#22d3ee" opacity="0.8" />
  </g>
  <g fill="url(#accent)">
    <rect x="829" y="100" width="9" height="9" rx="2" opacity="0.85" />
    <rect x="1118" y="219" width="8" height="8" rx="2" opacity="0.8" />
    <rect x="841" y="274" width="5" height="5" rx="1" opacity="0.65" />
